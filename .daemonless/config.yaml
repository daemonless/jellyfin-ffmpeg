build:
  architectures:
    - amd64
    - aarch64
  variants:
    # <major>-pkg-latest + per-variant pkg_name: the status page tracks each line
    # against its FreeBSD package (per arch), not jellyfin's GitHub releases.
    - tag: "8-pkg-latest"
      pkg_name: jellyfin-ffmpeg
      containerfile: Containerfile.pkg
      args:
        JFFMPEG_PORT: jellyfin-ffmpeg
        JFFMPEG_BIN: jellyfin-ffmpeg8
      aliases: ["8", "latest"]
      default: true
      tag_desc: "**FreeBSD Package**. 8.x line, official `jellyfin-ffmpeg` pkg (latest branch)."
    - tag: "7-pkg-latest"
      pkg_name: jellyfin-ffmpeg7
      containerfile: Containerfile.pkg
      args:
        JFFMPEG_PORT: jellyfin-ffmpeg7
        JFFMPEG_BIN: jellyfin-ffmpeg7
      aliases: ["7"]
      tag_desc: "**FreeBSD Package**. 7.x line, official `jellyfin-ffmpeg7` pkg (latest branch)."

cit:
  mode: command
  command: ["-version"]
  expect_exit: 0
  expect_output: "ffmpeg version .*Jellyfin"
  puid: false
